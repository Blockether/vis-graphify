[project]
name = "vis-graphify"
version = "0.2.2"
description = "Code knowledge graphs for Vis with graphify: build, search, explain, paths, hubs, change impact and domain flows, with full Clojure support."
keywords = ["graph", "code"]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "vis-agent>=0.2.45",
  "graphifyy @ git+https://github.com/Blockether/graphify@v0.9.84-blockether.5",
]

[tool.vis]
category = "tools"
source_paths = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Pinned so a new ruff default set cannot change the verdict of a release.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Result dataclasses are data, not test cases: collect functions only.
python_classes = []
