[project]
name = "vis-graphify"
version = "0.16.2"
description = "Code knowledge graphs for Vis with graphify: search, change impact, exact references, safe renames and moves, domain flows, and a knowledge base server with ontology, documents and undoable edits."
keywords = ["graph", "code"]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "vis-agent>=0.2.45",
  "graphifyy[pdf,office] @ git+https://github.com/Blockether/graphify@v0.9.93-blockether.21",
  # Native Leiden: graphify clusters with it instead of networkx Louvain, about twice as fast.
  "graspologic-native>=1.3.1,<2",
]

[tool.vis]
category = "tools"
source_paths = ["src"]

[tool.ruff]
line-length = 120
# evals/tasks holds the seed projects of the Harbor tasks: fixture data, not package code.
extend-exclude = ["*.md", "evals/tasks"]

[tool.ruff.lint]
# Pinned so a new ruff default set cannot change the verdict of a release.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Result dataclasses are data, not test cases: collect functions only.
python_classes = []
